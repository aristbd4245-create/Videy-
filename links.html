<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videy - Links</title>
<style>
  /* Reset dasar */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    /* Font Times New Roman agar persis seperti di foto */
    font-family: 'Times New Roman', Times, serif; 
    background: #ffffff;
    color: #000;
    padding: 30px 20px;
    max-width: 600px; /* Lebar maksimal agar tetap rapi di PC */
    margin: 0 auto;
  }

  /* Bagian Logo Videy */
  .logo-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 30px;
  }

  .logo-box {
    width: 45px;
    height: 45px;
    background: #111;
    color: #fff;
    font-weight: bold;
    font-size: 1.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-family: system-ui, -apple-system, sans-serif;
  }

  .logo-text {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #111;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* Daftar Link */
  .link-list {
    display: flex;
    flex-direction: column;
    gap: 14px; /* Jarak antar baris link */
  }

  /* Format Link persis seperti di foto */
  .link-list a {
    color: #1a73e8; /* Warna biru */
    text-decoration: underline; /* Garis bawah */
    font-size: 1.25rem; /* Ukuran teks */
    word-break: break-all; /* Agar link panjang turun ke bawah */
    line-height: 1.3;
  }
  
  .link-list a:hover {
    color: #0b57d0;
  }

  .loading, .empty {
    color: #888;
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

  <!-- LOGO VIDEY -->
  <div class="logo-container">
    <div class="logo-box">V</div>
    <div class="logo-text">videy</div>
  </div>

  <!-- DAFTAR LINK -->
  <div class="link-list" id="linkList">
    <div class="loading">Memuat link...</div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, orderBy, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyATGNzE8e6McTLl9OnDV70aKfyXhDR_Jgo",
    authDomain: "videy-clone-50c2b.firebaseapp.com",
    projectId: "videy-clone-50c2b",
    storageBucket: "videy-clone-50c2b.firebasestorage.app",
    messagingSenderId: "663076090581",
    appId: "1:663076090581:web:7c977193104a43b18ba85c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const videosRef = collection(db, "videos");

  // Sort deterministik (memastikan urutan selalu konsisten)
  function sortVideosDeterministic(videos) {
    return [...videos].sort((a, b) => {
      const ta = a.createdAt || 0;
      const tb = b.createdAt || 0;
      if (tb !== ta) return tb - ta;
      return String(b.id || '').localeCompare(String(a.id || ''));
    });
  }

  function renderList(videos) {
    const listEl = document.getElementById('linkList');
    // Ambil 25 video terbaru
    const sorted = sortVideosDeterministic(videos).slice(0, 25);

    if (sorted.length === 0) {
      listEl.innerHTML = '<div class="empty">Belum ada video.</div>';
      return;
    }

    // ✅ PERBAIKAN: Ambil Base URL yang bersih (tanpa nama file & tanpa slash di akhir)
    // Ini memastikan link yang dihasilkan selalu rapi dan tidak bentrok
    let base = location.origin + location.pathname.replace(/links\.html?$/i, '');
    base = base.replace(/\/$/, ''); // Hilangkan trailing slash jika ada

    // Render menjadi daftar link bersih seperti di foto
    listEl.innerHTML = sorted.map(v => {
      // Link permanen per video (?id=...)
      const url = base + '/?id=' + encodeURIComponent(v.id);
      return `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
    }).join('');
  }

  // Load Data Realtime
  const q = query(videosRef, orderBy('createdAt', 'desc'));
  onSnapshot(q, (snap) => {
    const videos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderList(videos);
  }, (err) => {
    document.getElementById('linkList').innerHTML = 
      `<div class="empty" style="color:red;">Gagal memuat: ${err.message}</div>`;
  });
</script>
</body>
</html>
