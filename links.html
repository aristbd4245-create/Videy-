<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Link Video - videy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #ffffff; color: #111; padding: 20px; }

  /* === HEADER / LOGO videy === */
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .logo-box {
    width: 40px; height: 40px;
    background: #111; color: #fff;
    font-weight: bold; font-size: 1.3rem;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #111;
    margin: 0;
  }

  /* === TOMBOL SALIN HALAMAN === */
  .copy-page-btn {
    margin-bottom: 20px;
    padding: 10px 20px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .copy-page-btn:hover { background: #333; }

  /* === DAFTAR LINK === */
  .link-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 900px;
  }

  .link-item {
    display: block;
    color: #1a73e8;
    font-size: 1rem;
    text-decoration: underline;
    word-break: break-all;
    line-height: 1.5;
    padding: 4px 0;
  }
  .link-item:hover { color: #0d47a1; }

  /* === INFO BATCH === */
  .batch-info {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 12px;
    padding: 8px 12px;
    background: #f0f8ff;
    border: 1px solid #dce9f5;
    border-radius: 6px;
    display: inline-block;
  }
  .batch-info code {
    background: #fff;
    padding: 1px 6px;
    border-radius: 3px;
    color: #d63384;
    font-size: 0.78rem;
  }

  /* === RESPONSIVE === */
  @media (max-width: 600px) {
    body { padding: 14px; }
    .header h1 { font-size: 1.5rem; }
    .logo-box { width: 34px; height: 34px; font-size: 1.1rem; }
    .link-item { font-size: 0.85rem; }
  }
</style>
</head>
<body>

  <!-- HEADER LOGO videy -->
  <div class="header">
    <div class="logo-box">V</div>
    <h1>videy</h1>
  </div>

  <!-- Tombol untuk menyalin link halaman ini -->
  <button class="copy-page-btn" onclick="copyPageUrl()">
     Salin Link Halaman Ini
  </button>

  <!-- Info batch -->
  <div class="batch-info" id="batchInfo" style="display:none;"></div>

  <!-- Tempat daftar link akan dimunculkan -->
  <div class="link-list" id="linkList">
    <p style="color:#888;">Memuat video terbaru...</p>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy, where, limit }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyATGNzE8e6McTLl9OnDV70aKfyXhDR_Jgo",
    authDomain: "videy-clone-50c2b.firebaseapp.com",
    projectId: "videy-clone-50c2b",
    storageBucket: "videy-clone-50c2b.firebasestorage.app",
    messagingSenderId: "663076090581",
    appId: "1:663076090581:web:7c977193104a43b18ba85c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const videosRef = collection(db, "videos");

  const params = new URLSearchParams(location.search);
  const batchParam = params.get('batch');

  async function loadLinks() {
    const container = document.getElementById('linkList');
    const infoEl = document.getElementById('batchInfo');

    try {
      let docs = [];

      if (batchParam) {
        // Mode batch: tampilkan HANYA video dengan batchId tertentu
        const targetBatch = Number(batchParam);
        // Query berdasarkan batchId (exact match)
        const q1 = query(videosRef, where('batchId', '==', targetBatch), orderBy('createdAt', 'asc'));
        const snap1 = await getDocs(q1);
        docs = snap1.docs;

        // Jika batchId tidak ketemu (video lama tanpa batchId), coba fallback:
        // cari video dengan createdAt dalam rentang 5 menit dari targetBatch
        if (docs.length === 0) {
          const q2 = query(videosRef, orderBy('createdAt', 'desc'));
          const snap2 = await getDocs(q2);
          docs = snap2.docs.filter(d => {
            const data = d.data();
            const t = data.batchId || data.createdAt;
            return Math.abs(t - targetBatch) <= 5 * 60 * 1000;
          });
        }

        if (infoEl) {
          infoEl.style.display = 'inline-block';
          infoEl.innerHTML = ` Menampilkan <strong>${docs.length} video</strong> dari batch upload terbaru <code>${escapeHtml(batchParam)}</code>`;
        }
      } else {
        // Mode default: tampilkan video dari batch TERBARU saja
        const q = query(videosRef, orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        const allVideos = snap.docs;

        if (allVideos.length === 0) {
          container.innerHTML = '<p style="color:#888;">Belum ada video di database.</p>';
          return;
        }

        // Tentukan batch terbaru = createdAt video paling baru
        const newest = allVideos[0].data();
        const newestBatch = newest.batchId || newest.createdAt;

        // Ambil semua video yang batchId-nya sama (atau createdAt dalam 5 menit)
        docs = allVideos.filter(d => {
          const data = d.data();
          const t = data.batchId || data.createdAt;
          return Math.abs(t - newestBatch) <= 5 * 60 * 1000;
        });

        if (infoEl) {
          infoEl.style.display = 'inline-block';
          infoEl.innerHTML = ` Menampilkan <strong>${docs.length} video</strong> dari upload terbaru`;
        }
      }

      if (docs.length === 0) {
        container.innerHTML = '<p style="color:#888;">Tidak ada video untuk batch ini.</p>';
        return;
      }

      const baseUrl = location.origin + location.pathname.replace(/links\.html?$/i, '');

      // Urutkan ascending (video yang diupload duluan di atas)
      docs.sort((a, b) => {
        const ta = a.data().createdAt || 0;
        const tb = b.data().createdAt || 0;
        return ta - tb;
      });

      const linksHtml = docs.map((docSnap) => {
        const url = baseUrl + '?id=' + docSnap.id;
        return `<a href="${url}" target="_blank" rel="noopener" class="link-item">${url}</a>`;
      }).join('');

      container.innerHTML = linksHtml;

    } catch (e) {
      container.innerHTML = `<p style="color:#ff4757;">Gagal memuat data: ${e.message}</p>`;
    }
  }

  // Fungsi untuk menyalin URL halaman ini (dengan batch param jika ada)
  window.copyPageUrl = function() {
    const pageUrl = window.location.href;

    navigator.clipboard.writeText(pageUrl).then(() => {
      alert('Berhasil menyalin link halaman ini!');
    }).catch(err => {
      const ta = document.createElement('textarea');
      ta.value = pageUrl;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert('Berhasil menyalin link halaman ini!');
    });
  };

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"]/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
    }[m]));
  }

  loadLinks();
</script>
</body>
</html>
