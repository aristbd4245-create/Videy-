<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Link Video - videy</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #ffffff; color: #111; padding: 20px; }

  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .logo-box {
    width: 40px; height: 40px;
    background: #111; color: #fff;
    font-weight: bold; font-size: 1.3rem;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    flex-shrink: 0;
  }
  .header h1 {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #111;
    margin: 0;
  }

  .copy-page-btn {
    margin-bottom: 20px;
    padding: 10px 20px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.9rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .copy-page-btn:hover { background: #333; }

  .link-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 900px;
  }

  .link-item {
    display: block;
    color: #1a73e8;
    font-size: 1rem;
    text-decoration: underline;
    word-break: break-all;
    line-height: 1.5;
    padding: 4px 0;
  }
  .link-item:hover { color: #0d47a1; }

  .batch-info {
    font-size: 0.8rem;
    color: #888;
    margin-bottom: 12px;
    padding: 8px 12px;
    background: #f0f8ff;
    border: 1px solid #dce9f5;
    border-radius: 6px;
    display: inline-block;
  }
  .batch-info code {
    background: #fff;
    padding: 1px 6px;
    border-radius: 3px;
    color: #d63384;
    font-size: 0.78rem;
  }

  @media (max-width: 600px) {
    body { padding: 14px; }
    .header h1 { font-size: 1.5rem; }
    .logo-box { width: 34px; height: 34px; font-size: 1.1rem; }
    .link-item { font-size: 0.85rem; }
  }
</style>
</head>
<body>

  <div class="header">
    <div class="logo-box">V</div>
    <h1>videy</h1>
  </div>

  <button class="copy-page-btn" onclick="copyPageUrl()">
    📋 Salin Link Halaman Ini
  </button>

  <div class="batch-info" id="batchInfo" style="display:none;"></div>

  <div class="link-list" id="linkList">
    <p style="color:#888;">Memuat video terbaru...</p>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy, where }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyATGNzE8e6McTLl9OnDV70aKfyXhDR_Jgo",
    authDomain: "videy-clone-50c2b.firebaseapp.com",
    projectId: "videy-clone-50c2b",
    storageBucket: "videy-clone-50c2b.firebasestorage.app",
    messagingSenderId: "663076090581",
    appId: "1:663076090581:web:7c977193104a43b18ba85c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const videosRef = collection(db, "videos");

  const params = new URLSearchParams(location.search);
  const batchParam = params.get('batch');

  // ==========================================
  // SORT DETERMINISTIK — SAMA PERSIS dengan admin.html
  // ==========================================
  function sortVideosDeterministic(videos) {
    return [...videos].sort((a, b) => {
      const ta = a.createdAt || 0;
      const tb = b.createdAt || 0;
      if (tb !== ta) return tb - ta;
      return String(b.id || '').localeCompare(String(a.id || ''));
    });
  }

  async function loadLinks() {
    const container = document.getElementById('linkList');
    const infoEl = document.getElementById('batchInfo');

    try {
      let videos = [];

      if (batchParam) {
        const targetBatch = Number(batchParam);
        const q1 = query(videosRef, where('batchId', '==', targetBatch));
        const snap1 = await getDocs(q1);
        videos = snap1.docs.map(d => ({ id: d.id, ...d.data() }));

        if (videos.length === 0) {
          const q2 = query(videosRef, orderBy('createdAt', 'desc'));
          const snap2 = await getDocs(q2);
          videos = snap2.docs
            .map(d => ({ id: d.id, ...d.data() }))
            .filter(v => {
              const t = v.batchId || v.createdAt;
              return Math.abs(t - targetBatch) <= 5 * 60 * 1000;
            });
        }

        if (infoEl) {
          infoEl.style.display = 'inline-block';
          infoEl.innerHTML = `📦 Menampilkan <strong>${videos.length} video</strong> dari batch <code>${escapeHtml(batchParam)}</code>`;
        }
      } else {
        const q = query(videosRef, orderBy('createdAt', 'desc'));
        const snap = await getDocs(q);
        videos = snap.docs.map(d => ({ id: d.id, ...d.data() }));

        if (videos.length === 0) {
          container.innerHTML = '<p style="color:#888;">Belum ada video di database.</p>';
          return;
        }

        if (infoEl) {
          infoEl.style.display = 'inline-block';
          infoEl.innerHTML = `🆕 Menampilkan <strong>25 video terbaru</strong> (video baru di atas)`;
        }
      }

      if (videos.length === 0) {
        container.innerHTML = '<p style="color:#888;">Tidak ada video.</p>';
        return;
      }

      const sorted = sortVideosDeterministic(videos);
      const top25 = batchParam ? sorted : sorted.slice(0, 25);

      const baseUrl = location.origin + location.pathname.replace(/links\.html?$/i, '');

      const linksHtml = top25.map((v) => {
        const url = baseUrl + '?id=' + v.id;
        return `<a href="${url}" target="_blank" rel="noopener" class="link-item">${url}</a>`;
      }).join('');

      container.innerHTML = linksHtml;

    } catch (e) {
      container.innerHTML = `<p style="color:#ff4757;">Gagal memuat data: ${escapeHtml(e.message)}</p>`;
    }
  }

  window.copyPageUrl = function() {
    const pageUrl = window.location.href;

    navigator.clipboard.writeText(pageUrl).then(() => {
      alert('Berhasil menyalin link halaman ini!');
    }).catch(err => {
      const ta = document.createElement('textarea');
      ta.value = pageUrl;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      alert('Berhasil menyalin link halaman ini!');
    });
  };

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"]/g, m => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'
    }[m]));
  }

  loadLinks();
</script>
</body>
</html>
