<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Videy - Links</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Times New Roman', Times, serif; 
    background: #ffffff;
    color: #000;
    padding: 30px 20px;
    max-width: 600px;
    margin: 0 auto;
  }

  .logo-container {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }

  .logo-box {
    width: 45px;
    height: 45px;
    background: #111;
    color: #fff;
    font-weight: bold;
    font-size: 1.6rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    font-family: system-ui, -apple-system, sans-serif;
  }

  .logo-text {
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #111;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* Info Batch */
  .batch-info {
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    color: #666;
    margin-bottom: 24px;
    padding-bottom: 12px;
    border-bottom: 1px solid #eee;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .batch-info strong { color: #229ED9; }
  .batch-info a { color: #1a73e8; text-decoration: none; font-weight: 600; }
  .batch-info a:hover { text-decoration: underline; }

  /* Daftar Link */
  .link-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .link-list a {
    color: #1a73e8;
    text-decoration: underline;
    font-size: 1.25rem;
    word-break: break-all;
    line-height: 1.3;
  }
  
  .link-list a:hover { color: #0b57d0; }

  .loading, .empty {
    color: #888;
    font-family: system-ui, sans-serif;
    font-size: 0.9rem;
    text-align: center;
    padding: 20px;
  }
</style>
</head>
<body>

  <div class="logo-container">
    <div class="logo-box">V</div>
    <div class="logo-text">videy</div>
  </div>

  <div class="batch-info" id="batchInfo"></div>
  
  <div class="link-list" id="linkList">
    <div class="loading">Memuat link...</div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, query, orderBy, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyATGNzE8e6McTLl9OnDV70aKfyXhDR_Jgo",
    authDomain: "videy-clone-50c2b.firebaseapp.com",
    projectId: "videy-clone-50c2b",
    storageBucket: "videy-clone-50c2b.firebasestorage.app",
    messagingSenderId: "663076090581",
    appId: "1:663076090581:web:7c977193104a43b18ba85c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const videosRef = collection(db, "videos");

  function sortVideosDeterministic(videos) {
    return [...videos].sort((a, b) => {
      const ta = a.createdAt || 0;
      const tb = b.createdAt || 0;
      if (tb !== ta) return tb - ta;
      return String(b.id || '').localeCompare(String(a.id || ''));
    });
  }

  const params = new URLSearchParams(location.search);
  const targetBatch = params.get('batch'); 

  function renderList(videos) {
    const listEl = document.getElementById('linkList');
    const infoEl = document.getElementById('batchInfo');
    
    const sorted = sortVideosDeterministic(videos);
    let displayVideos = [];

    if (targetBatch) {
      // Jika ada parameter ?batch=, filter hanya video di batch tersebut
      displayVideos = sorted.filter(v => Math.floor((v.createdAt || 0) / 60000).toString() === targetBatch);
      
      if (displayVideos.length > 0) {
        const batchTime = new Date(displayVideos[0].createdAt).toLocaleString('id-ID');
        infoEl.innerHTML = `<span>📦 Menampilkan <strong>${displayVideos.length} video</strong> (Batch: ${batchTime})</span>`;
      }
    } else {
      // Jika tidak ada ?batch=, ambil video dari batch terbaru saja
      const batches = {};
      sorted.forEach(v => {
        const bId = Math.floor((v.createdAt || 0) / 60000).toString();
        if (!batches[bId]) batches[bId] = [];
        batches[bId].push(v);
      });
      
      const latestBatchId = Object.keys(batches).sort((a, b) => b - a)[0];
      if (latestBatchId) {
        displayVideos = batches[latestBatchId];
        const batchTime = new Date(displayVideos[0].createdAt).toLocaleString('id-ID');
        infoEl.innerHTML = `<span>📦 Menampilkan <strong>${displayVideos.length} video</strong> (Upload Terbaru: ${batchTime})</span>`;
      }
    }

    if (displayVideos.length === 0) {
      infoEl.innerHTML = '';
      listEl.innerHTML = '<div class="empty">Tidak ada link video untuk batch ini.</div>';
      return;
    }

    let base = location.origin + location.pathname.replace(/links\.html?$/i, '');
    base = base.replace(/\/$/, '');

    listEl.innerHTML = displayVideos.map(v => {
      const url = base + '/?id=' + encodeURIComponent(v.id);
      return `<a href="${url}" target="_blank" rel="noopener">${url}</a>`;
    }).join('');
  }

  const q = query(videosRef, orderBy('createdAt', 'desc'));
  onSnapshot(q, (snap) => {
    const videos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderList(videos);
  }, (err) => {
    document.getElementById('linkList').innerHTML = 
      `<div class="empty" style="color:red;">Gagal memuat: ${err.message}</div>`;
  });
</script>
</body>
</html>
