<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoStream</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #ffffff; color: #111; }
  a { color: inherit; text-decoration: none; }
  .hidden { display: none !important; }

  /* === HEADER / NAVBAR === */
  .header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e5e5; background: #ffffff; }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo-box { width: 36px; height: 36px; background: #111; color: #fff; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
  .header h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; color: #111; }
  .upload-btn { background: #111; color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; border: none; }
  .upload-btn:hover { background: #333; }

  /* === MAIN CONTAINER === */
  .main-container { max-width: 100%; margin: 0 auto; padding: 0; }
  
  /* === LIST VIDEO (Grid) === */
  .video-grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 20px; max-width: 1800px; margin: 0 auto; }
  .video-box { background: #000; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; border: 1px solid #333; transition: transform 0.2s, opacity 0.2s; }
  .video-box:hover { transform: scale(1.03); opacity: 0.9; }
  .video-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video-box .play-icon { position: absolute; font-size: 2rem; color: rgba(255,255,255,0.8); pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  .video-box .badge { position: absolute; top: 6px; left: 6px; padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; font-weight: bold; color: #fff; z-index: 2; }
  .video-box .badge.direct { background: #2d5a7a; }
  .video-box .badge.dood { background: #2d7a3e; }
  .video-box .badge.abyss { background: #7a3e2d; }
  .video-box .badge.playmogo { background: #7a5a2d; }
  .video-box .title-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px 8px 6px 8px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); color: #fff; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 0.2s; z-index: 2; font-family: system-ui, sans-serif; }
  .video-box:hover .title-overlay { opacity: 1; }

  /* === PLAYER VIEW (PERSIS SCREENSHOT) === */
  .view-player-wrapper {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 40px;
    background: #ffffff;
    min-height: calc(100vh - 70px);
  }

  .player-container {
    position: relative;
    width: 100%;
    aspect-ratio: 9/16; /* Rasio layar HP (Vertikal) */
    background: #111;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
  }
  
  .player-container iframe, .player-container video { 
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: #000; 
  }
  .player-container video { object-fit: contain; }
  .player-container .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #555; font-size: 0.95rem; }

  /* Tombol Download Bawah Video */
  .download-container {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }
  .download-btn { 
    background: #f0f0f0; border: none; color: #111; 
    padding: 12px 60px; border-radius: 30px; font-weight: 700; font-size: 1rem; 
    cursor: pointer; transition: 0.2s;
  }
  .download-btn:hover { background: #e0e0e0; }

  /* Tombol Kembali (Disembunyikan di player agar persis videy, tapi tetap bisa dipakai di URL) */
  .back-nav { text-align: center; margin-top: 20px; }
  .back-nav button { background: none; border: none; color: #888; cursor: pointer; font-size: 0.85rem; text-decoration: underline; }

  /* === MODAL DOWNLOAD (SPONSOR) === */
  .dl-modal { position: fixed; inset: 0; background: #f9f9f9; display: none; flex-direction: column; align-items: center; z-index: 200; padding: 40px 20px; overflow-y: auto; }
  .dl-modal.show { display: flex; }
  .dl-modal h2 { font-size: 1.6rem; font-weight: 800; margin-bottom: 24px; color: #111; width: 100%; max-width: 400px; text-align: left; }
  .dl-box { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid #f0f0f0; }
  .dl-step { font-weight: 700; margin-bottom: 16px; color: #111; text-align: left; font-size: 0.95rem; }
  .dl-progress { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: relative; padding: 0 10px; }
  .dl-progress::before { content: ''; position: absolute; top: 50%; left: 10px; right: 10px; height: 2px; background: #ccc; z-index: 1; transform: translateY(-50%); }
  .dl-dot { width: 14px; height: 14px; background: #333; border-radius: 50%; position: relative; z-index: 2; box-shadow: 0 0 0 4px #fff; }
  .dl-text { color: #555; font-size: 0.9rem; margin-bottom: 20px; text-align: left; line-height: 1.5; }
  .dl-action-btn { width: 100%; background: #111; color: #fff; padding: 16px; border-radius: 12px; font-weight: 700; font-size: 1rem; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; }
  .dl-action-btn:hover { background: #333; }
  .dl-action-btn:disabled { background: #555; cursor: wait; }
  .dl-footer { font-size: 0.8rem; color: #777; margin-top: 16px; text-align: left; line-height: 1.4; }

  /* Responsive Grid */
  @media (max-width: 600px) {
    .video-grid-container { grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 12px; }
    .view-player-wrapper { padding: 16px 12px; min-height: auto; }
    .player-container { border-radius: 12px; }
    .download-btn { width: 100%; max-width: 250px; }
  }
</style>
</head>
<body>

<!-- Tampilan Header Default (Untuk List Video) -->
<div class="header" id="mainHeader">
  <div class="header-left">
    <div class="logo-box">V</div>
    <h1>VideoStream</h1>
  </div>
  <a href="https://t.me/VipKitaa" target="_blank" rel="noopener" class="upload-btn">Join Telegram</a>
</div>

<div class="main-container">
  <!-- TAMPILAN LIST VIDEO -->
  <div id="viewList">
    <div class="video-grid-container" id="videoGrid">
      <div style="grid-column: 1 / -1; text-align: center; color: #888; padding: 20px;">Memuat daftar video...</div>
    </div>
  </div>

  <!-- TAMPILAN PLAYER VIDEO -->
  <div id="viewPlayer" class="hidden">
    
    <!-- HEADER KHUSUS PLAYER -->
    <div class="header" style="border-bottom: none; margin-bottom: -10px;">
      <div class="header-left">
        <div class="logo-box">V</div>
        <h1>videy</h1>
      </div>
      <button class="upload-btn" onclick="goBackToList()">Upload</button>
    </div>

    <div class="view-player-wrapper">
      <div class="player-container" id="playerWrapper">
        <div class="placeholder">Memuat video...</div>
      </div>
      
      <!-- TOMBOL DOWNLOAD -->
      <div class="download-container">
        <button class="download-btn" onclick="openDownloadModal()">Download</button>
      </div>
      
      <!-- Tombol kembali -->
      <div class="back-nav">
        <button onclick="goBackToList()">Kembali ke Daftar</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL DOWNLOAD (SPONSOR) - LANGKAH 4 DARI 4 -->
<div class="dl-modal" id="downloadModal">
  <h2>Download Video</h2>
  <div class="dl-box">
    <div class="dl-step">Langkah 4 dari 4</div>
    <div class="dl-progress">
      <div class="dl-dot"></div>
      <div class="dl-dot"></div>
      <div class="dl-dot"></div>
      <div class="dl-dot"></div>
    </div>
    <p class="dl-text" id="dlText">
      Siap download. Proses akan berjalan otomatis setelah langkah ini.
    </p>
    <button class="dl-action-btn" id="dlActionBtn" onclick="processDownload()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
      Download
    </button>
    <p class="dl-footer">
      Setelah kembali dari halaman sponsor, proses download akan berlanjut otomatis.
    </p>
  </div>
</div>

<!-- SCRIPT POPUNDER BARU -->
<script data-cfasync="false" src="https://benchform.org/1/9e72240f75b407d58c240d814380fcc7"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy, doc, updateDoc, increment, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyATGNzE8e6McTLl9OnDV70aKfyXhDR_Jgo",
    authDomain: "videy-clone-50c2b.firebaseapp.com",
    projectId: "videy-clone-50c2b",
    storageBucket: "videy-clone-50c2b.firebasestorage.app",
    messagingSenderId: "663076090581",
    appId: "1:663076090581:web:7c977193104a43b18ba85c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const videosRef = collection(db, "videos");

  const DOOD_THUMB_DOMAINS = [
    'https://img.doodcdn.co/snaps/',
    'https://img.doodcdn.com/snaps/',
    'https://imgds.net/snaps/'
  ];

  // ==========================================
  // DATA & STATE
  // ==========================================
  let allVideos = [];
  let currentId = null;
  let currentVideo = null;
  let unsubVideo = null;

  const params = new URLSearchParams(location.search);
  currentId = params.get('id');

  function isDirectVideoUrl(url) {
    if (!url) return false;
    if (/aceimp\.com\/upload\//i.test(url)) return false;
    try {
      const u = new URL(url);
      if (/\.(mp4|webm|mov|m4v|ogv)$/i.test(u.pathname)) return true;
    } catch (e) {
      if (/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(url)) return true;
    }
    return false;
  }

  function getProvider(v) {
    if (v.provider) return v.provider;
    const src = v.src || extractSrc(v.embed);
    if (isDirectVideoUrl(src)) return 'direct';
    if (/abyssplayer\.com/i.test(src)) return 'abyss';
    if (/(dood\.|doodstream|doodapi)/i.test(src)) return 'doodstream';
    if (/playmogo\.com/i.test(src)) return 'playmogo';
    return 'unknown';
  }

  function proxyImage(url) {
    if (!url) return '';
    if (url.includes('doodcdn') || url.includes('imgds.net') || url.includes('dood.')) {
      return 'https://wsrv.nl/?url=' + encodeURIComponent(url);
    }
    return url;
  }

  window.tryThumb = function (img, id, attempt) {
    if (attempt < DOOD_THUMB_DOMAINS.length) {
      const nextUrl = DOOD_THUMB_DOMAINS[attempt] + id + '.jpg';
      img.src = 'https://wsrv.nl/?url=' + encodeURIComponent(nextUrl);
      img.onerror = () => window.tryThumb(img, id, attempt + 1);
    } else {
      const parent = img.parentNode;
      if (parent) parent.innerHTML = '<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#222; color:#555; font-size:2rem;">▶</div>';
    }
  };

  async function loadVideos() {
    try {
      const q = query(videosRef, orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      allVideos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderVideoGrid(allVideos);
      if (currentId) {
        const found = allVideos.find(v => v.id === currentId);
        if (found) {
          showPlayerView();
          startWatch(found);
        }
      }
    } catch (e) {
      document.getElementById('videoGrid').innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #ff4757; padding: 20px;">Gagal memuat: ' + escapeHtml(e.message) + '</div>';
    }
  }

  function renderVideoGrid(videos) {
    const grid = document.getElementById('videoGrid');
    if (videos.length === 0) {
      grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #888; padding: 20px;">Belum ada video.</div>';
      return;
    }

    grid.innerHTML = videos.map(v => {
      let thumbUrl = v.thumb || v.splash || '';
      if (!thumbUrl && v.doodId) {
        thumbUrl = 'https://img.doodcdn.co/snaps/' + v.doodId + '.jpg';
      }

      const displayThumb = proxyImage(thumbUrl);
      const provider = getProvider(v);
      const isDirect = provider === 'direct';
      
      let badgeClass = 'dood';
      let badgeText = 'DOOD';
      if (provider === 'abyss') { badgeClass = 'abyss'; badgeText = 'ABYSS'; }
      else if (provider === 'playmogo') { badgeClass = 'playmogo'; badgeText = 'PMOGO'; }
      else if (isDirect) { badgeClass = 'direct'; badgeText = 'MP4'; }

      const fallbackAttr = v.doodId 
        ? `onerror="tryThumb(this, '${v.doodId}', 1)"` 
        : `onerror="this.style.display='none'"`;

      return `
        <div class="video-box" onclick="openVideoPlayer('${v.id}')">
          <span class="badge ${badgeClass}">${badgeText}</span>
          ${displayThumb ? `<img src="${escapeHtml(displayThumb)}" alt="" ${fallbackAttr}>` : `<div style="width:100%; height:100%; background:#222;"></div>`}
          <div class="play-icon">▶</div>
          <div class="title-overlay">${escapeHtml(v.title || 'Tanpa Judul')}</div>
        </div>
      `;
    }).join('');
  }

  window.openVideoPlayer = function(id) {
    const video = allVideos.find(v => v.id === id);
    if (!video) return;
    showPlayerView();
    startWatch(video);
    history.pushState(null, '', '?id=' + id);
  };

  function showPlayerView() {
    document.getElementById('viewList').classList.add('hidden');
    document.getElementById('viewPlayer').classList.remove('hidden');
    document.getElementById('mainHeader').classList.add('hidden');
    window.scrollTo(0, 0);
  }

  window.goBackToList = function() {
    if (unsubVideo) { unsubVideo(); unsubVideo = null; }
    document.getElementById('viewPlayer').classList.add('hidden');
    document.getElementById('viewList').classList.remove('hidden');
    document.getElementById('mainHeader').classList.remove('hidden');
    history.pushState(null, '', location.pathname);
    document.getElementById('playerWrapper').innerHTML = '<div class="placeholder">Memuat video...</div>';
  };

  function startWatch(v) {
    currentVideo = v;
    currentId = v.id;

    if (unsubVideo) { unsubVideo(); unsubVideo = null; }
    unsubVideo = onSnapshot(doc(db, 'videos', v.id), (snap) => {
      if (!snap.exists()) return;
      const data = snap.data();
      currentVideo = { id: snap.id, ...data };
    });

    renderVideoElement(v);
    tryPlayVideo();
  }

  function renderVideoElement(v) {
    const src = v.src || extractSrc(v.embed);
    const provider = getProvider(v);
    const wrapper = document.getElementById('playerWrapper');

    if (provider === 'direct' || isDirectVideoUrl(src)) {
      let poster = v.thumb || v.splash || '';
      poster = proxyImage(poster);
      wrapper.innerHTML = `
        <video id="mainVideo" src="${escapeHtml(src)}" controls playsinline preload="metadata"
          ${poster ? `poster="${escapeHtml(poster)}"` : ''}
          style="position:absolute;top:0;left:0;width:100%;height:100%;background:#000;object-fit:contain;">
        </video>
      `;
      const videoEl = wrapper.querySelector('#mainVideo');
      if (videoEl) {
        videoEl.addEventListener('error', () => {
          wrapper.innerHTML = `<div class="placeholder" style="color:#ff4757;flex-direction:column;gap:8px;padding:20px;text-align:center;">
            <span>Gagal memutar video langsung.</span>
            <a href="${escapeHtml(src)}" target="_blank" rel="noopener" style="color:#229ED9;font-size:0.8rem;">Buka di tab baru</a>
          </div>`;
        });
      }
    } else {
      wrapper.innerHTML = `
        <iframe id="mainIframe" src="${escapeHtml(src)}" scrolling="no" frameborder="0"
          allowfullscreen="true" allow="autoplay; encrypted-media"
          style="position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#000;">
        </iframe>
      `;
    }
  }

  async function tryPlayVideo() {
    const wrapper = document.getElementById('playerWrapper');
    const videoEl = wrapper.querySelector('#mainVideo');
    if (videoEl) {
      try { await videoEl.play(); } catch (err) { videoEl.controls = true; }
    }

    if (currentVideo && currentVideo.id) {
      const seen = JSON.parse(sessionStorage.getItem('viewed_videos') || '[]');
      if (!seen.includes(currentVideo.id)) {
        seen.push(currentVideo.id);
        sessionStorage.setItem('viewed_videos', JSON.stringify(seen));
        try { await updateDoc(doc(db, 'videos', currentVideo.id), { views: increment(1) }); } catch (e) {}
      }
    }
  }

  // ==========================================
  // LOGIKA DOWNLOAD & SPONSOR (IKLAN)
  // ==========================================
  let downloadTargetUrl = '';

  window.openDownloadModal = function() {
    if (!currentVideo) return;
    
    const src = currentVideo.src || extractSrc(currentVideo.embed);
    downloadTargetUrl = src; 

    // Tampilkan modal
    document.getElementById('downloadModal').classList.add('show');
    
    // Reset status tombol
    const btn = document.getElementById('dlActionBtn');
    btn.disabled = false;
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Download`;
    document.getElementById('dlText').innerHTML = 'Siap download. Proses akan berjalan otomatis setelah langkah ini.';
  };

  window.processDownload = function() {
    const btn = document.getElementById('dlActionBtn');
    const text = document.getElementById('dlText');
    
    // 1. Ubah status tombol jadi loading
    btn.disabled = true;
    btn.innerHTML = 'Memproses...';
    text.innerHTML = 'Membuka halaman sponsor... Mohon tunggu.';

    // 2. Picu Iklan/Sponsor (Popunder) 
    // Script popunder akan merespon aksi klik user ini
    try {
      // Opsional: Jika ingin membuka link sponsor manual di tab baru, gunakan window.open
      // window.open('https://benchform.org/1/9e72240f75b407d58c240d814380fcc7', '_blank');
    } catch(e) {
      console.log('Ad error', e);
    }

    // 3. Hitung mundur 5 detik untuk menonton iklan
    let countdown = 5;
    text.innerHTML = `Menonton iklan... (${countdown}s)`;
    const interval = setInterval(() => {
      countdown--;
      text.innerHTML = `Menonton iklan... (${countdown}s)`;
      
      if (countdown <= 0) {
        clearInterval(interval);
        finishDownload();
      }
    }, 1000);
  };

  function finishDownload() {
    const btn = document.getElementById('dlActionBtn');
    const text = document.getElementById('dlText');
    
    text.innerHTML = '✅ Iklan selesai. Download dimulai!';
    btn.innerHTML = 'Download Siap';
    
    // 4. Eksekusi Download
    if (downloadTargetUrl) {
      const isMp4 = downloadTargetUrl.match(/\.(mp4|webm|mov)/i) || downloadTargetUrl.includes('aceimp.com');
      
      if (isMp4) {
        const a = document.createElement('a');
        a.href = downloadTargetUrl;
        a.download = (currentVideo.title || 'video') + '.mp4';
        a.target = '_blank';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      } else {
        window.open(downloadTargetUrl, '_blank');
      }
    }

    setTimeout(() => {
      document.getElementById('downloadModal').classList.remove('show');
    }, 2000);
  }

  // ==========================================
  // UTILS
  // ==========================================
  function extractSrc(embed) {
    embed = (embed || '').trim();
    if (embed.includes('<iframe')) {
      const m = embed.match(/src=["']([^"']+)["']/);
      if (m) return m[1];
    }
    return embed;
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
  }

  loadVideos();
</script>
</body>
</html>
