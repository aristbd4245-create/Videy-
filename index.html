  #downloadModal .dl-continue:disabled { background: #ccc; }
  #downloadModal .dl-note { font-size: 0.75rem; color: #777; text-align: center; }
  #downloadModal .dl-cancel { width: 100%; padding: 10px; background: transparent; color: #888; border: none; font-size: 0.82rem; cursor: pointer; }
  @media (max-width: 600px) { .video-grid-container { grid-template-columns: repeat(2, 1fr); gap: 8px; } }
</style>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy, doc, updateDoc, increment, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyATGNzE8e6McTLl9OnDV70aKfyXhDR_Jgo",
    authDomain: "videy-clone-50c2b.firebaseapp.com",
    projectId: "videy-clone-50c2b",
    storageBucket: "videy-clone-50c2b.firebasestorage.app",
    messagingSenderId: "663076090581",
    appId: "1:663076090581:web:7c977193104a43b18ba85c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const videosRef = collection(db, "videos");

  const DOOD_THUMB_DOMAINS = [
    'https://img.doodcdn.co/snaps/',
    'https://img.doodcdn.com/snaps/',
    'https://imgds.net/snaps/'
  ];

  let allVideos = [];
  let currentId = null;
  let currentVideo = null;
  let unsubVideo = null;
  let dlStep = 1;
  const DL_TOTAL_STEPS = 4;
  const DL_SPONSOR_URL = 'https://benchform.org/1/9e72240f75b407d58c240d814380fcc7';

  const params = new URLSearchParams(location.search);
  currentId = params.get('id');

  function isDirectVideoUrl(url) {
    if (!url) return false;
    if (/aceimp\.com\/upload\//i.test(url)) return false;
    try {
      const u = new URL(url);
      if (/\.(mp4|webm|mov|m4v|ogv)$/i.test(u.pathname)) return true;
    } catch (e) {
      if (/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(url)) return true;
    }
    return false;
  }

  function getProvider(v) {
    if (v.provider) return v.provider;
    const src = v.src || extractSrc(v.embed);
    if (isDirectVideoUrl(src)) return 'direct';
    if (/abyssplayer\.com/i.test(src)) return 'abyss';
    if (/(dood\.|doodstream|doodapi)/i.test(src)) return 'doodstream';
    return 'unknown';
  }

  // === FUNGSI PROXY GAMBAR ===
  // Jika gambar dari DoodStream diblokir (Hotlink), kita "titipkan" ke server proxy
  function proxyImage(url) {
    if (!url) return '';
    // Hanya proxy gambar DoodStream
    if (url.includes('doodcdn') || url.includes('imgds.net') || url.includes('dood.')) {
      return 'https://wsrv.nl/?url=' + encodeURIComponent(url);
    }
    return url;
  }

  window.tryThumb = function (img, id, attempt) {
    if (attempt < DOOD_THUMB_DOMAINS.length) {
      const nextUrl = DOOD_THUMB_DOMAINS[attempt] + id + '.jpg';
      img.src = 'https://wsrv.nl/?url=' + encodeURIComponent(nextUrl);
      img.onerror = () => window.tryThumb(img, id, attempt + 1);
    } else {
      const parent = img.parentNode;
      if (parent) parent.innerHTML = '<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#222; color:#555; font-size:2rem;">▶</div>';
    }
  };

  async function loadVideos() {
    try {
      const q = query(videosRef, orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      allVideos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderVideoGrid(allVideos);
      if (currentId) {
        const found = allVideos.find(v => v.id === currentId);
        if (found) {
          showPlayerView();
          startWatch(found);
        }
      }
    } catch (e) {
      document.getElementById('videoGrid').innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #ff4757; padding: 20px;">Gagal memuat: ' + escapeHtml(e.message) + '</div>';
    }
  }

  function renderVideoGrid(videos) {
    const grid = document.getElementById('videoGrid');
    if (videos.length === 0) {
      grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #888; padding: 20px;">Belum ada video.</div>';
      return;
    }

    grid.innerHTML = videos.map(v => {
      let thumbUrl = v.thumb || v.splash || '';
      // Jika tidak ada thumbnail manual, coba pakai DoodStream ID
      if (!thumbUrl && v.doodId) {
        thumbUrl = 'https://img.doodcdn.co/snaps/' + v.doodId + '.jpg';
      }

      // Gunakan proxy jika linknya dari DoodStream
      const displayThumb = proxyImage(thumbUrl);

      const provider = getProvider(v);
      const isDirect = provider === 'direct';
      
      let badgeClass = 'dood';
      let badgeText = 'DOOD';
      if (provider === 'abyss') { badgeClass = 'abyss'; badgeText = 'ABYSS'; }
      else if (isDirect) { badgeClass = 'direct'; badgeText = 'MP4'; }

      const fallbackAttr = v.doodId 
        ? `onerror="tryThumb(this, '${v.doodId}', 1)"` 
        : `onerror="this.style.display='none'"`;

      return `
        <div class="video-box" onclick="openVideoPlayer('${v.id}')">
          <span class="badge ${badgeClass}">${badgeText}</span>
          ${displayThumb ? `<img src="${escapeHtml(displayThumb)}" alt="" ${fallbackAttr}>` : `<div style="width:100%; height:100%; background:#222;"></div>`}
          <div class="play-icon">▶</div>
          <div class="title-overlay">${escapeHtml(v.title || 'Tanpa Judul')}</div>
        </div>
      `;
    }).join('');
  }

  window.openVideoPlayer = function(id) {
    const video = allVideos.find(v => v.id === id);
    if (!video) return;
    showPlayerView();
    startWatch(video);
    history.pushState(null, '', '?id=' + id);
  };

  function showPlayerView() {
    document.getElementById('viewList').classList.add('hidden');
    document.getElementById('viewPlayer').classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  window.goBackToList = function() {
    if (unsubVideo) { unsubVideo(); unsubVideo = null; }
    document.getElementById('viewPlayer').classList.add('hidden');
    document.getElementById('viewList').classList.remove('hidden');
    history.pushState(null, '', location.pathname);
    document.getElementById('playerWrapper').innerHTML = '<div class="placeholder">Memuat video...</div>';
  };

  function startWatch(v) {
    currentVideo = v;
    currentId = v.id;
    const wrapper = document.getElementById('playerWrapper');
    // Gunakan proxy untuk splash juga
    let splash = v.splash || v.thumb || '';
    splash = proxyImage(splash);

    wrapper.innerHTML = `
      ${splash ? `<img class="splash" src="${escapeHtml(splash)}" alt="">` : ''}
      <div class="ad-gate" id="adGate">
        <h3>Tunggu Sebentar</h3>
        <p>Buka iklan dulu <b>1 kali</b>, lalu balik nonton lagi di sini.</p>
        <button id="gateBtn" onclick="openAdAndContinue()">🚀 Buka Iklan &amp; Lanjut</button>
        <div class="sub" id="gateSub">Klik tombol di atas untuk melanjutkan</div>
      </div>
    `;
    
    document.getElementById('videoTitle').textContent = v.title || 'Tanpa Judul';
    document.getElementById('shareUrl').value = location.origin + location.pathname + '?id=' + v.id;
    document.getElementById('shareRow').style.display = 'flex';

    if (unsubVideo) { unsubVideo(); unsubVideo = null; }
    unsubVideo = onSnapshot(doc(db, 'videos', v.id), (snap) => {
      if (!snap.exists()) return;
      const data = snap.data();
      currentVideo = { id: snap.id, ...data };
      document.getElementById('videoTitle').textContent = data.title || 'Tanpa Judul';
      document.getElementById('videoStats').innerHTML = `👁 ${data.views || 0} views &nbsp;·&nbsp; 👍 ${data.likes || 0} likes`;
      document.getElementById('likeCount').textContent = data.likes || 0;
      const likedList = JSON.parse(localStorage.getItem('liked_videos') || '[]');
      document.getElementById('likeBtn').classList.toggle('liked', likedList.includes(v.id));
    });
  }

  window.openAdAndContinue = function () {
    if (DL_SPONSOR_URL) window.open(DL_SPONSOR_URL, '_blank');
    const btn = document.getElementById('gateBtn');
    const sub = document.getElementById('gateSub');
    btn.disabled = true;
    btn.textContent = '⏳ Tunggu 5 detik...';
    sub.textContent = 'Silakan kembali setelah iklan terbuka.';
    let sisa = 5;
    const t = setInterval(() => {
      sisa--;
      if (sisa > 0) { btn.textContent = `⏳ Tunggu ${sisa} detik...`; } 
      else {
        clearInterval(t);
        btn.disabled = false;
        btn.textContent = '▶ Lanjut Nonton';
        btn.onclick = () => playVideoNow(currentVideo);
        sub.textContent = 'Klik untuk mulai menonton.';
      }
    }, 1000);
  };

  async function playVideoNow(v) {
    if (!v) return;
    const src = v.src || extractSrc(v.embed);
    const provider = getProvider(v);
    const wrapper = document.getElementById('playerWrapper');

    if (provider === 'direct' || isDirectVideoUrl(src)) {
      let poster = v.thumb || v.splash || '';
      poster = proxyImage(poster);
      
      wrapper.innerHTML = `<video src="${escapeHtml(src)}" controls playsinline preload="metadata" ${poster ? `poster="${escapeHtml(poster)}"` : ''} style="position:absolute;top:0;left:0;width:100%;height:100%;background:#000;object-fit:contain;"></video>`;
      const videoEl = wrapper.querySelector('video');
      if (videoEl) {
        videoEl.addEventListener('error', () => {
          wrapper.innerHTML = `<div class="placeholder" style="color:#ff4757;flex-direction:column;gap:8px;padding:20px;text-align:center;"><span>Gagal memutar video langsung.</span><a href="${escapeHtml(src)}" target="_blank" rel="noopener" style="color:#229ED9;font-size:0.8rem;">Buka di tab baru</a></div>`;
        });
      }
    } else {
      wrapper.innerHTML = `<iframe src="${escapeHtml(src)}" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; encrypted-media"></iframe>`;
    }

    const seen = JSON.parse(sessionStorage.getItem('viewed_videos') || '[]');
    if (!seen.includes(v.id)) {
      seen.push(v.id);
      sessionStorage.setItem('viewed_videos', JSON.stringify(seen));
      try { await updateDoc(doc(db, 'videos', v.id), { views: increment(1) }); } catch (e) {}
    }
  }

  window.toggleLike = async function () {
    if (!currentVideo) return;
    const likedList = JSON.parse(localStorage.getItem('liked_videos') || '[]');
    const idx = likedList.indexOf(currentVideo.id);
    try {
      if (idx === -1) {
        likedList.push(currentVideo.id);
        await updateDoc(doc(db, 'videos', currentVideo.id), { likes: increment(1) });
        document.getElementById('likeBtn').classList.add('liked');
      } else {
        likedList.splice(idx, 1);
        await updateDoc(doc(db, 'videos', currentVideo.id), { likes: increment(-1) });
        document.getElementById('likeBtn').classList.remove('liked');
      }
      localStorage.setItem('liked_videos', JSON.stringify(likedList));
    } catch (e) { alert('Gagal like: ' + e.message); }
  };

  window.openDownloadGate = function () {
    if (!currentVideo) return;
    dlStep = 1;
    updateDownloadUI();
    document.getElementById('downloadModal').classList.add('show');
  };
  window.closeDownloadGate = function () { document.getElementById('downloadModal').classList.remove('show'); };
  window.dlContinue = function () {
    if (dlStep < DL_TOTAL_STEPS) {
      if (DL_SPONSOR_URL) window.open(DL_SPONSOR_URL, '_blank');
      dlStep++;
      updateDownloadUI();
    } else { startFinalDownload(); }
  };

  function updateDownloadUI() {
    const dots = document.querySelectorAll('#dlProgress .dot');
    dots.forEach((d, i) => {
      d.classList.remove('done', 'active');
      if (i + 1 < dlStep) d.classList.add('done');
      else if (i + 1 === dlStep) d.classList.add('active');
    });
    if (dlStep <= DL_TOTAL_STEPS) {
      document.getElementById('dlStepLabel').textContent = `Langkah ${dlStep} dari ${DL_TOTAL_STEPS}`;
      document.getElementById('dlDesc').textContent = 'Silakan ikuti langkah berikut untuk melanjutkan proses download.';
      document.getElementById('dlContinueBtn').textContent = 'Lanjut Download';
      document.getElementById('dlNote').textContent = 'Setelah kembali dari halaman sponsor, proses download akan berlanjut otomatis.';
      document.getElementById('dlNote').style.color = '#777';
      document.getElementById('dlContinueBtn').disabled = false;
    }
  }

  function startFinalDownload() {
    const dots = document.querySelectorAll('#dlProgress .dot');
    dots.forEach(d => { d.classList.remove('active'); d.classList.add('done'); });
    document.getElementById('dlStepLabel').textContent = '✅ Download Siap';
    document.getElementById('dlDesc').textContent = 'Terima kasih! Klik tombol di bawah untuk mulai mengunduh video.';
    document.getElementById('dlContinueBtn').textContent = '⬇ Mulai Download';
    document.getElementById('dlContinueBtn').disabled = false;
    document.getElementById('dlContinueBtn').onclick = () => doActualDownload();
    document.getElementById('dlNote').textContent = 'Video akan terbuka di tab baru / tersimpan otomatis.';
    document.getElementById('dlNote').style.color = '#4caf50';
  }

  async function doActualDownload() {
    if (!currentVideo) return;
    const src = currentVideo.src || extractSrc(currentVideo.embed);
    const provider = getProvider(currentVideo);
    if (provider === 'abyss') {
      closeDownloadGate();
      alert('Maaf, video dari server Abyss tidak mendukung unduhan langsung.');
      return;
    }
    let downloadUrl = src;
    if (provider === 'direct' || isDirectVideoUrl(src)) { downloadUrl = src; } 
    else if (/dood\.|doodstream/i.test(src)) { downloadUrl = src.replace(/\/(e|d)\//, '/d/'); }
    window.open(downloadUrl, '_blank');
    closeDownloadGate();
  }

  window.openShare = function () {
    if (!currentVideo) return;
    const url = location.origin + location.pathname + '?id=' + currentVideo.id;
    const text = encodeURIComponent(currentVideo.title || 'Tonton video ini');
    const enc = encodeURIComponent(url);
    document.getElementById('shareGrid').innerHTML = `
      <a href="https://wa.me/?text=${text}%20${enc}" target="_blank"><span class="ico">💬</span>WhatsApp</a>
      <a href="https://www.facebook.com/sharer/sharer.php?u=${enc}" target="_blank"><span class="ico">📘</span>Facebook</a>
      <a href="https://t.me/share/url?url=${enc}&text=${text}" target="_blank"><span class="ico">✈️</span>Telegram</a>
      <a href="https://twitter.com/intent/tweet?url=${enc}&text=${text}" target="_blank"><span class="ico">🐦</span>X</a>
      <a href="https://api.whatsapp.com/send?text=${text}%20${enc}" target="_blank"><span class="ico">📱</span>WA 2</a>
      <a href="#" onclick="copyShare();return false;"><span class="ico">📋</span>Salin</a>
    `;
    document.getElementById('shareModal').classList.add('show');
  };
  window.closeShare = function () { document.getElementById('shareModal').classList.remove('show'); };
  window.copyShare = function () {
    const input = document.getElementById('shareUrl');
    input.select();
    input.setSelectionRange(0, 99999);
    try { navigator.clipboard.writeText(input.value); alert('Link disalin'); } catch (e) { document.execCommand('copy'); alert('Link disalin'); }
  };

  function extractSrc(embed) {
    embed = (embed || '').trim();
    if (embed.includes('<iframe')) {
      const m = embed.match(/src=["']([^"']+)["']/);
      if (m) return m[1];
    }
    return embed;
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
  }

  loadVideos();
</script>
</body>
