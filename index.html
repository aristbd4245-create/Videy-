<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoStream</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #ffffff; color: #111; }
  a { color: inherit; text-decoration: none; }
  .header { padding: 18px 20px; text-align: center; border-bottom: 1px solid #e5e5e5; position: relative; background: #ffffff; }
  .header h1 { font-size: 1.6rem; font-weight: 600; letter-spacing: 1px; color: #111; }
  .header h1 span { color: #ff4757; }
  .tg-btn { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: #229ED9; padding: 8px 14px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; color: #fff; }
  .tg-btn:hover { background: #1b8ec4; }
  .main-container { max-width: 1800px; margin: 20px auto; padding: 0 16px; }
  .hidden { display: none !important; }
  .video-grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .video-box { background: #000; aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; display: flex; align-items: center; justify-content: center; border: 1px solid #333; transition: transform 0.2s, opacity 0.2s; }
  .video-box:hover { transform: scale(1.03); opacity: 0.9; }
  .video-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video-box .play-icon { position: absolute; font-size: 2rem; color: rgba(255,255,255,0.8); pointer-events: none; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
  .video-box .badge { position: absolute; top: 6px; left: 6px; padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; font-weight: bold; color: #fff; z-index: 2; }
  .video-box .badge.direct { background: #2d5a7a; }
  .video-box .badge.dood { background: #2d7a3e; }
  .video-box .badge.abyss { background: #7a3e2d; }
  .video-box .title-overlay { position: absolute; bottom: 0; left: 0; width: 100%; padding: 20px 8px 6px 8px; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); color: #fff; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity 0.2s; z-index: 2; font-family: system-ui, sans-serif; }
  .video-box:hover .title-overlay { opacity: 1; }
  .btn-back { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: #f0f0f0; color: #111; border: 1px solid #ddd; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; margin-bottom: 16px; }
  .btn-back:hover { background: #e5e5e5; }
  .video-wrapper {
    position: relative;
    padding-bottom: 62%;
    height: 0;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    max-width: 1800px;
    max-height: 820px;
    margin: 0 auto;
  }
  .video-wrapper iframe, .video-wrapper video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .video-wrapper video { object-fit: contain; }
  .video-wrapper .placeholder { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #555; font-size: 0.95rem; }
  .video-info { margin-top: 12px; padding: 0 4px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
  .video-info .meta { flex: 1; min-width: 200px; }
  .video-info h2 { font-size: 1.15rem; font-weight: 500; line-height: 1.4; color: #111; }
  .video-info .stats { color: #777; font-size: 0.82rem; margin-top: 6px; display: flex; gap: 14px; }
  .action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .action-row button { display: flex; align-items: center; gap: 6px; padding: 9px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; color: #111; background: #f7f7f7; }
  .action-row button:hover { background: #eee; }
  .action-row .like-btn.liked { background: #ff4757; color: #fff; border-color: #ff4757; }
  .share-row { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .share-row input { flex: 1; min-width: 160px; padding: 9px 12px; background: #fff; border: 1px solid #ddd; border-radius: 8px; color: #555; font-size: 0.8rem; }
  .share-row button { padding: 9px 16px; background: #ff4757; color: #fff; border: none; border-radius: 8px; font-size: 0.85rem; cursor: pointer; font-weight: 600; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .modal-bg.show { display: flex; }
  .modal { background: #ffffff; border: 1px solid #e5e5e5; border-radius: 14px; padding: 24px; max-width: 380px; width: 100%; color: #111; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
  .modal h3 { margin-bottom: 16px; font-size: 1.1rem; color: #111; }
  .share-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .share-grid a { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 6px; background: #f7f7f7; border: 1px solid #eee; border-radius: 10px; font-size: 0.75rem; text-align: center; color: #111; }
  .share-grid a:hover { background: #eee; }
  .share-grid .ico { font-size: 1.4rem; }
  .modal .close-btn { width: 100%; padding: 10px; background: #f0f0f0; border: 1px solid #ddd; border-radius: 8px; color: #111; cursor: pointer; font-size: 0.85rem; }
  .modal .close-btn:hover { background: #e5e5e5; }

  /* === SOSIAL BAR CONTAINER === */
  .socialbar-container {
    width: 100%;
    min-height: 60px;
    margin: 12px auto;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .socialbar-container.on-player { margin: 0 0 12px 0; }

  /* === BANNER 300x250 === */
  .banner-ad-wrap {
    display: flex;
    justify-content: center;
    margin: 18px auto;
    max-width: 300px;
    min-height: 250px;
    background: #fafafa;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    overflow: hidden;
  }
  .banner-ad-wrap iframe { width: 300px; height: 250px; border: 0; display: block; background: transparent; }

  /* === PRE-ROLL GATE 5 DETIK === */
  .preroll-gate {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 10;
    color: #fff;
    text-align: center;
    padding: 20px;
    overflow-y: auto;
  }
  .preroll-gate .gate-label {
    font-size: 0.75rem;
    color: #aaa;
    margin-bottom: 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .preroll-gate .gate-ad-slot {
    width: 100%;
    max-width: 360px;
    min-height: 80px;
    margin-bottom: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .preroll-gate .gate-countdown {
    font-size: 2.4rem;
    font-weight: 700;
    color: #ff4757;
    margin-bottom: 6px;
    font-variant-numeric: tabular-nums;
  }
  .preroll-gate .gate-text {
    font-size: 0.85rem;
    color: #ddd;
    margin-bottom: 14px;
  }
  .preroll-gate .gate-btn {
    display: none;
    padding: 12px 28px;
    background: #ff4757;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .preroll-gate .gate-btn:hover { background: #e03e4e; }
  .preroll-gate .gate-btn.show { display: inline-block; }
  .preroll-gate .gate-progress {
    width: 200px;
    height: 4px;
    background: #333;
    border-radius: 2px;
    overflow: hidden;
    margin-top: 12px;
  }
  .preroll-gate .gate-progress-bar {
    height: 100%;
    background: #ff4757;
    width: 0%;
    transition: width 0.1s linear;
  }

  @media (max-width: 600px) {
    .video-grid-container { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .video-wrapper { padding-bottom: 60%; border-radius: 0; margin: 0 -16px; max-height: none; }
  }
  @media (min-width: 1400px) {
    .video-wrapper { max-height: 820px; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>Video<span>Stream</span></h1>
  <a href="https://t.me/VipKitaa" target="_blank" rel="noopener" class="tg-btn">✈ Join Telegram</a>
</div>
<div class="main-container">
  <div id="viewList">
    <h2 style="font-size: 1.1rem; margin-bottom: 16px; color: #111;">Pilih Video</h2>

    <!-- SOSIAL BAR #1 — di halaman list, atas grid -->
    <div class="socialbar-container" id="socialbarList">
      <script data-cfasync="false" src="https://biomanos.org/14/684edfbc0abd12a80ccb934dbdd668c1"></script>
    </div>

    <div class="video-grid-container" id="videoGrid">
      <div style="grid-column: 1 / -1; text-align: center; color: #888; padding: 20px;">Memuat daftar video...</div>
    </div>
  </div>

  <div id="viewPlayer" class="hidden">
    <button class="btn-back" onclick="goBackToList()">← Kembali ke Daftar Video</button>

    <!-- SOSIAL BAR #2 — di halaman player, atas video wrapper -->
    <div class="socialbar-container on-player" id="socialbarPlayer">
      <!-- akan diisi ulang via JS saat masuk player -->
    </div>

    <div class="video-wrapper" id="playerWrapper">
      <div class="placeholder">Memuat video...</div>
    </div>
    <div class="video-info">
      <div class="meta">
        <h2 id="videoTitle">Memuat...</h2>
        <div class="stats" id="videoStats"></div>
      </div>
    </div>
    <div class="action-row">
      <button class="like-btn" id="likeBtn" onclick="toggleLike()">👍 <span id="likeCount">0</span> Like</button>
      <button onclick="openShare()">🔗 Share</button>
    </div>

    <!-- BANNER 300x250 — di halaman player -->
    <div class="banner-ad-wrap">
      <iframe id="bannerAdFrame"
              sandbox="allow-scripts allow-same-origin"
              scrolling="no"
              style="width:300px;height:250px;border:0;display:block;background:transparent;">
      </iframe>
    </div>

    <div class="share-row" id="shareRow" style="display:none;">
      <input type="text" id="shareUrl" readonly>
      <button onclick="copyShare()">Salin Link</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="shareModal">
  <div class="modal">
    <h3>Bagikan Video</h3>
    <div class="share-grid" id="shareGrid"></div>
    <button class="close-btn" onclick="closeShare()">Tutup</button>
  </div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy, doc, updateDoc, increment, onSnapshot }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyATGNzE8e6McTLl9OnDV70aKfyXhDR_Jgo",
    authDomain: "videy-clone-50c2b.firebaseapp.com",
    projectId: "videy-clone-50c2b",
    storageBucket: "videy-clone-50c2b.firebasestorage.app",
    messagingSenderId: "663076090581",
    appId: "1:663076090581:web:7c977193104a43b18ba85c"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const videosRef = collection(db, "videos");

  const DOOD_THUMB_DOMAINS = [
    'https://img.doodcdn.co/snaps/',
    'https://img.doodcdn.com/snaps/',
    'https://imgds.net/snaps/'
  ];

  // ==========================================
  // IKLAN: Sosial Bar + Banner biomanos.org
  // ==========================================
  const SOCIALBAR_SRC = 'https://biomanos.org/14/684edfbc0abd12a80ccb934dbdd668c1';
  const BANNER_SRC = 'https://biomanos.org/22/2bc85909669de26b545e3502cadf231e';
  const BANNER_KEY = 'banner_loaded_date';

  // Muat sosial bar ke container tertentu (dipanggil ulang saat masuk player)
  function loadSocialBar(containerId) {
    const c = document.getElementById(containerId);
    if (!c) return;
    // Bersihkan dulu
    c.innerHTML = '';
    const s = document.createElement('script');
    s.src = SOCIALBAR_SRC;
    s.async = true;
    s.setAttribute('data-cfasync', 'false');
    s.setAttribute('data-socialbar', '1');
    c.appendChild(s);
  }

  // Muat banner 300x250 ke iframe terisolasi (1x per hari)
  function loadBannerOnce() {
    const today = new Date().toDateString();
    try {
      if (localStorage.getItem(BANNER_KEY) === today) return;
      localStorage.setItem(BANNER_KEY, today);
    } catch (e) {
      if (sessionStorage.getItem(BANNER_KEY) === '1') return;
      sessionStorage.setItem(BANNER_KEY, '1');
    }

    const frame = document.getElementById('bannerAdFrame');
    if (!frame) return;
    try {
      const doc = frame.contentDocument || frame.contentWindow.document;
      doc.open();
      doc.write(`<!DOCTYPE html><html><head><meta charset="utf-8">
        <style>html,body{margin:0;padding:0;background:transparent;overflow:hidden;}</style>
        <script>atOptions={'key':'2bc85909669de26b545e3502cadf231e','format':'iframe','height':250,'width':300,'params':{}};<\/script>
        </head><body>
        <script data-cfasync="false" src="${BANNER_SRC}"><\/script>
        </body></html>`);
      doc.close();
    } catch (e) {
      console.warn('Banner iframe error:', e);
    }
  }

  // ==========================================
  // PRE-ROLL GATE 5 DETIK
  // - User harus klik area iklan ATAU tunggu 5 detik
  // - Baru tombol "Lanjut ke Video" aktif
  // ==========================================
  const GATE_SECONDS = 5;

  function showPrerollGate(onDone) {
    const wrapper = document.getElementById('playerWrapper');
    let remaining = GATE_SECONDS;
    let userInteracted = false;

    wrapper.innerHTML = `
      <div class="preroll-gate" id="prerollGate">
        <div class="gate-label">Iklan</div>
        <div class="gate-ad-slot" id="gateAdSlot">
          <!-- Sosial bar dimuat di sini -->
        </div>
        <div class="gate-countdown" id="gateCountdown">${remaining}</div>
        <div class="gate-text">Klik iklan atau tunggu <span id="gateSecText">${remaining}</span> detik untuk lanjut</div>
        <button class="gate-btn" id="gateBtn">▶ Lanjut ke Video</button>
        <div class="gate-progress"><div class="gate-progress-bar" id="gateBar"></div></div>
      </div>
    `;

    // Muat sosial bar ke dalam gate
    const slot = document.getElementById('gateAdSlot');
    const sb = document.createElement('script');
    sb.src = SOCIALBAR_SRC;
    sb.async = true;
    sb.setAttribute('data-cfasync', 'false');
    sb.setAttribute('data-socialbar', '1');
    slot.appendChild(sb);

    const countdownEl = document.getElementById('gateCountdown');
    const secTextEl = document.getElementById('gateSecText');
    const btn = document.getElementById('gateBtn');
    const bar = document.getElementById('gateBar');

    setTimeout(() => { bar.style.width = '100%'; }, 50);

    // Deteksi klik di area iklan -> anggap user sudah interaksi
    slot.addEventListener('click', () => {
      userInteracted = true;
    }, true);

    const finish = () => {
      clearInterval(interval);
      const gate = document.getElementById('prerollGate');
      if (gate) gate.remove();
      window._cancelPrerollGate = null;
      onDone();
    };

    const interval = setInterval(() => {
      remaining--;
      if (remaining < 0) remaining = 0;
      countdownEl.textContent = remaining;
      secTextEl.textContent = remaining;

      if (remaining <= 0) {
        clearInterval(interval);
        countdownEl.textContent = '✓';
        countdownEl.style.color = '#4caf50';
        document.querySelector('#prerollGate .gate-text').textContent = 'Silakan lanjut menonton.';
        btn.classList.add('show');
        btn.focus();
      }
    }, 1000);

    btn.addEventListener('click', finish, { once: true });

    // Kalau user back sebelum selesai
    window._cancelPrerollGate = () => {
      clearInterval(interval);
      const gate = document.getElementById('prerollGate');
      if (gate) gate.remove();
      window._cancelPrerollGate = null;
    };
  }

  // ==========================================
  // DATA & STATE
  // ==========================================
  let allVideos = [];
  let currentId = null;
  let currentVideo = null;
  let unsubVideo = null;

  const params = new URLSearchParams(location.search);
  currentId = params.get('id');

  function isDirectVideoUrl(url) {
    if (!url) return false;
    if (/aceimp\.com\/upload\//i.test(url)) return false;
    try {
      const u = new URL(url);
      if (/\.(mp4|webm|mov|m4v|ogv)$/i.test(u.pathname)) return true;
    } catch (e) {
      if (/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(url)) return true;
    }
    return false;
  }

  function getProvider(v) {
    if (v.provider) return v.provider;
    const src = v.src || extractSrc(v.embed);
    if (isDirectVideoUrl(src)) return 'direct';
    if (/abyssplayer\.com/i.test(src)) return 'abyss';
    if (/(dood\.|doodstream|doodapi)/i.test(src)) return 'doodstream';
    return 'unknown';
  }

  function proxyImage(url) {
    if (!url) return '';
    if (url.includes('doodcdn') || url.includes('imgds.net') || url.includes('dood.')) {
      return 'https://wsrv.nl/?url=' + encodeURIComponent(url);
    }
    return url;
  }

  window.tryThumb = function (img, id, attempt) {
    if (attempt < DOOD_THUMB_DOMAINS.length) {
      const nextUrl = DOOD_THUMB_DOMAINS[attempt] + id + '.jpg';
      img.src = 'https://wsrv.nl/?url=' + encodeURIComponent(nextUrl);
      img.onerror = () => window.tryThumb(img, id, attempt + 1);
    } else {
      const parent = img.parentNode;
      if (parent) parent.innerHTML = '<div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#222; color:#555; font-size:2rem;">▶</div>';
    }
  };

  async function loadVideos() {
    try {
      const q = query(videosRef, orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      allVideos = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderVideoGrid(allVideos);
      if (currentId) {
        const found = allVideos.find(v => v.id === currentId);
        if (found) {
          showPlayerView();
          startWatch(found);
        }
      }
    } catch (e) {
      document.getElementById('videoGrid').innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #ff4757; padding: 20px;">Gagal memuat: ' + escapeHtml(e.message) + '</div>';
    }
  }

  function renderVideoGrid(videos) {
    const grid = document.getElementById('videoGrid');
    if (videos.length === 0) {
      grid.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #888; padding: 20px;">Belum ada video.</div>';
      return;
    }

    grid.innerHTML = videos.map(v => {
      let thumbUrl = v.thumb || v.splash || '';
      if (!thumbUrl && v.doodId) {
        thumbUrl = 'https://img.doodcdn.co/snaps/' + v.doodId + '.jpg';
      }

      const displayThumb = proxyImage(thumbUrl);
      const provider = getProvider(v);
      const isDirect = provider === 'direct';
      
      let badgeClass = 'dood';
      let badgeText = 'DOOD';
      if (provider === 'abyss') { badgeClass = 'abyss'; badgeText = 'ABYSS'; }
      else if (isDirect) { badgeClass = 'direct'; badgeText = 'MP4'; }

      const fallbackAttr = v.doodId 
        ? `onerror="tryThumb(this, '${v.doodId}', 1)"` 
        : `onerror="this.style.display='none'"`;

      return `
        <div class="video-box" onclick="openVideoPlayer('${v.id}')">
          <span class="badge ${badgeClass}">${badgeText}</span>
          ${displayThumb ? `<img src="${escapeHtml(displayThumb)}" alt="" ${fallbackAttr}>` : `<div style="width:100%; height:100%; background:#222;"></div>`}
          <div class="play-icon">▶</div>
          <div class="title-overlay">${escapeHtml(v.title || 'Tanpa Judul')}</div>
        </div>
      `;
    }).join('');
  }

  window.openVideoPlayer = function(id) {
    const video = allVideos.find(v => v.id === id);
    if (!video) return;
    showPlayerView();
    startWatch(video);
    history.pushState(null, '', '?id=' + id);
  };

  function showPlayerView() {
    document.getElementById('viewList').classList.add('hidden');
    document.getElementById('viewPlayer').classList.remove('hidden');
    window.scrollTo(0, 0);
    // Muat ulang sosial bar di halaman player
    loadSocialBar('socialbarPlayer');
  }

  window.goBackToList = function() {
    if (window._cancelPrerollGate) { window._cancelPrerollGate(); }
    if (unsubVideo) { unsubVideo(); unsubVideo = null; }
    document.getElementById('viewPlayer').classList.add('hidden');
    document.getElementById('viewList').classList.remove('hidden');
    history.pushState(null, '', location.pathname);
    document.getElementById('playerWrapper').innerHTML = '<div class="placeholder">Memuat video...</div>';
    // Muat ulang sosial bar di list (kadang script perlu re-init)
    loadSocialBar('socialbarList');
  };

  function startWatch(v) {
    currentVideo = v;
    currentId = v.id;

    document.getElementById('videoTitle').textContent = v.title || 'Tanpa Judul';
    document.getElementById('shareUrl').value = location.origin + location.pathname + '?id=' + v.id;
    document.getElementById('shareRow').style.display = 'flex';

    if (unsubVideo) { unsubVideo(); unsubVideo = null; }
    unsubVideo = onSnapshot(doc(db, 'videos', v.id), (snap) => {
      if (!snap.exists()) return;
      const data = snap.data();
      currentVideo = { id: snap.id, ...data };
      document.getElementById('videoTitle').textContent = data.title || 'Tanpa Judul';
      document.getElementById('videoStats').innerHTML = `👁 ${data.views || 0} views &nbsp;·&nbsp; 👍 ${data.likes || 0} likes`;
      document.getElementById('likeCount').textContent = data.likes || 0;
      const likedList = JSON.parse(localStorage.getItem('liked_videos') || '[]');
      document.getElementById('likeBtn').classList.toggle('liked', likedList.includes(v.id));
    });

    // Gate 5 detik -> baru play
    showPrerollGate(() => {
      playVideoNow(v);
    });
  }

  async function playVideoNow(v) {
    if (!v) return;
    const src = v.src || extractSrc(v.embed);
    const provider = getProvider(v);
    const wrapper = document.getElementById('playerWrapper');

    if (provider === 'direct' || isDirectVideoUrl(src)) {
      let poster = v.thumb || v.splash || '';
      poster = proxyImage(poster);
      
      wrapper.innerHTML = `<video src="${escapeHtml(src)}" controls playsinline preload="metadata" ${poster ? `poster="${escapeHtml(poster)}"` : ''} style="position:absolute;top:0;left:0;width:100%;height:100%;background:#000;object-fit:contain;"></video>`;
      const videoEl = wrapper.querySelector('video');
      if (videoEl) {
        videoEl.addEventListener('error', () => {
          wrapper.innerHTML = `<div class="placeholder" style="color:#ff4757;flex-direction:column;gap:8px;padding:20px;text-align:center;"><span>Gagal memutar video langsung.</span><a href="${escapeHtml(src)}" target="_blank" rel="noopener" style="color:#229ED9;font-size:0.8rem;">Buka di tab baru</a></div>`;
        });
      }
    } else {
      wrapper.innerHTML = `<iframe src="${escapeHtml(src)}" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; encrypted-media"></iframe>`;
    }

    // Muat banner setelah video mulai (lazy)
    setTimeout(loadBannerOnce, 2000);

    const seen = JSON.parse(sessionStorage.getItem('viewed_videos') || '[]');
    if (!seen.includes(v.id)) {
      seen.push(v.id);
      sessionStorage.setItem('viewed_videos', JSON.stringify(seen));
      try { await updateDoc(doc(db, 'videos', v.id), { views: increment(1) }); } catch (e) {}
    }
  }

  window.toggleLike = async function () {
    if (!currentVideo) return;
    const likedList = JSON.parse(localStorage.getItem('liked_videos') || '[]');
    const idx = likedList.indexOf(currentVideo.id);
    try {
      if (idx === -1) {
        likedList.push(currentVideo.id);
        await updateDoc(doc(db, 'videos', currentVideo.id), { likes: increment(1) });
        document.getElementById('likeBtn').classList.add('liked');
      } else {
        likedList.splice(idx, 1);
        await updateDoc(doc(db, 'videos', currentVideo.id), { likes: increment(-1) });
        document.getElementById('likeBtn').classList.remove('liked');
      }
      localStorage.setItem('liked_videos', JSON.stringify(likedList));
    } catch (e) { alert('Gagal like: ' + e.message); }
  };

  window.openShare = function () {
    if (!currentVideo) return;
    const url = location.origin + location.pathname + '?id=' + currentVideo.id;
    const text = encodeURIComponent(currentVideo.title || 'Tonton video ini');
    const enc = encodeURIComponent(url);
    document.getElementById('shareGrid').innerHTML = `
      <a href="https://wa.me/?text=${text}%20${enc}" target="_blank"><span class="ico">💬</span>WhatsApp</a>
      <a href="https://www.facebook.com/sharer/sharer.php?u=${enc}" target="_blank"><span class="ico">📘</span>Facebook</a>
      <a href="https://t.me/share/url?url=${enc}&text=${text}" target="_blank"><span class="ico">✈️</span>Telegram</a>
      <a href="https://twitter.com/intent/tweet?url=${enc}&text=${text}" target="_blank"><span class="ico">🐦</span>X</a>
      <a href="https://api.whatsapp.com/send?text=${text}%20${enc}" target="_blank"><span class="ico">📱</span>WA 2</a>
      <a href="#" onclick="copyShare();return false;"><span class="ico">📋</span>Salin</a>
    `;
    document.getElementById('shareModal').classList.add('show');
  };
  window.closeShare = function () { document.getElementById('shareModal').classList.remove('show'); };
  window.copyShare = function () {
    const input = document.getElementById('shareUrl');
    input.select();
    input.setSelectionRange(0, 99999);
    try { navigator.clipboard.writeText(input.value); alert('Link disalin'); } catch (e) { document.execCommand('copy'); alert('Link disalin'); }
  };

  function extractSrc(embed) {
    embed = (embed || '').trim();
    if (embed.includes('<iframe')) {
      const m = embed.match(/src=["']([^"']+)["']/);
      if (m) return m[1];
    }
    return embed;
  }

  function escapeHtml(str) {
    return String(str || '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
  }

  // Load awal
  loadVideos();
  // Pastikan sosial bar di list ter-init setelah load
  window.addEventListener('load', () => {
    loadSocialBar('socialbarList');
  });
</script>
</body>
</html>
